name: Test HDF5 Installation Fix

on:
  push:
    branches: [add-hdf5-dep]

jobs:
  test-hdf5:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install HDF5
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev

      - name: Test full dependencies
        run: uv pip install --system --cache-dir ~/.cache/uv -e '.[build]'

      - name: Test h5py installation
        run: |
          python -c "import h5py; print(f'h5py version: {h5py.__version__}')"
